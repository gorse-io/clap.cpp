name: Build Node runtime
description: Compile the shared core before npm packaging
inputs:
  runtime:
    description: Node platform-architecture directory
    required: true
runs:
  using: composite
  steps:
    - name: Configure portable shared core
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
      run: cmake --preset "node-$RUNTIME"
    - name: Build shared core
      shell: bash
      run: cmake --build build/node-runtime --config Release --target clap --parallel 4
    - name: Stage runtime, licenses and test fixture generator
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
      run: |
        cmake --install build/node-runtime --config Release --component runtime --prefix "$GITHUB_WORKSPACE/node/runtime/$RUNTIME"
        cp LICENSE node/LICENSE
        cp LICENSE "node/runtime/$RUNTIME/licenses/clap.txt"
        cp python/tests/tiny_models.py node/test/tiny_models.py
