name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test release version synchronization
        run: python -m unittest discover -s .github/scripts -v

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install FFmpeg for test fixtures
        if: matrix.os != 'windows-11-arm'
        uses: AnimMouse/setup-ffmpeg@v1
      - name: Install ARM64 FFmpeg for test fixtures
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64'
          Invoke-WebRequest 'https://github.com/tordona/ffmpeg-win-arm64/releases/download/9.0.2/ffmpeg-9.0.2-essentials-shared-win-arm64.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '909b9b6c3cd6ad670d9b0b651808a8fecfc22833b4d14b02c7c4de2ef398ac97') {
            throw 'FFmpeg archive checksum mismatch'
          }
          7z x $archive "-o$destination" -y
          (Get-ChildItem $destination -Filter ffmpeg.exe -Recurse).DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.os == 'windows-11-arm' && '-T ClangCL' || '' }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/clap-install"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: rust -> target
          build-warnings: ""
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Real CPU inference and safety tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Compile-fail thread-safety contract
        run: cargo test --manifest-path rust/Cargo.toml --doc
      - name: Test vendoring guards
        run: python -m unittest discover -s rust/tests -p test_vendor.py -v
      - name: Vendor pinned native sources and licenses
        run: python rust/scripts/vendor.py
      - name: Verify standalone package build
        run: cargo package --manifest-path rust/Cargo.toml --allow-dirty

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install build pytest "mypy>=1.8" "typing_extensions>=4.2"
      # build's default path builds the wheel FROM the sdist, exercising both.
      - name: Build source distribution and CPU wheel
        run: python -m build python --outdir dist
      - name: Install wheel
        run: python -m pip install --no-deps --no-index --find-links dist clap-cpp
      - name: Test installed CPU bindings
        run: python -m pytest python/tests -v

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    defaults:
      run:
        working-directory: node
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical oracle dependency
        run: python -m pip install numpy
      - name: Build CPU bindings
        run: npm ci
      - name: Generate tiny models and test bindings
        run: |
          npm run test:fixtures
          npm test
          npm run test:types
          npm run test:packaging
      - name: Pack source distribution
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - name: Install and test source distribution
        run: |
          npm install --prefix installed ./artifacts/*.tgz
          CLAP_CPP_MODULE="$PWD/installed/node_modules/clap-cpp" npm test
          cd installed/node_modules/clap-cpp
          npm run test:fixtures
          npm test
