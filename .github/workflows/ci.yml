name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install FFmpeg for test fixtures
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg --yes --no-progress ;;
          esac
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/clap-install"
