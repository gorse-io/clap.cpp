name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8
      - name: Check C/C++ formatting
        run: git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs -0 -r clang-format --dry-run --Werror

  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release validator dependency
        run: python -m pip install packaging
      - name: Test release metadata and asset validation
        run: python -m unittest discover -s .github/scripts -v

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install FFmpeg for test fixtures
        if: matrix.os != 'windows-11-arm'
        uses: AnimMouse/setup-ffmpeg@v1
      - name: Install ARM64 FFmpeg for test fixtures
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64'
          Invoke-WebRequest 'https://github.com/tordona/ffmpeg-win-arm64/releases/download/9.0.2/ffmpeg-9.0.2-essentials-shared-win-arm64.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '909b9b6c3cd6ad670d9b0b651808a8fecfc22833b4d14b02c7c4de2ef398ac97') {
            throw 'FFmpeg archive checksum mismatch'
          }
          7z x $archive "-o$destination" -y
          (Get-ChildItem $destination -Filter ffmpeg.exe -Recurse).DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.os == 'windows-11-arm' && '-T ClangCL' || '' }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/clap-install"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: . -> target
          build-warnings: ""
      - name: Build configuration tests
        shell: bash
        run: |
          mkdir -p target
          rustc --edition=2021 --test rust/build.rs -o target/build-script-tests
          target/build-script-tests
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Default-backend inference and safety tests
        run: cargo test --all-targets
      - name: Compile-fail thread-safety contract
        run: cargo test --doc
      - name: Check package inventory and pinned sources
        run: python -m unittest discover -s rust/tests -p test_package.py -v
      - name: Verify standalone package build
        run: cargo package --allow-dirty
      - name: Test standalone package inference and safety
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          manifest="target/package/clap-cpp-${version}/Cargo.toml"
          cargo test --manifest-path "$manifest" --all-targets --locked
          cargo test --manifest-path "$manifest" --doc --locked
          python -m unittest discover -s "$(dirname "$manifest")/rust/tests" -p test_package.py -v
      - name: Recheck checkout after package verification
        run: cargo test --all-targets --locked

  rust-gpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            feature: vulkan
          - os: macos-latest
            feature: metal
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache-workspaces: . -> target
          build-warnings: ""
      - name: Install Vulkan SDK and software driver
        if: matrix.feature == 'vulkan'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers mesa-vulkan-drivers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "GGML_VK_VISIBLE_DEVICES=0" >> "$GITHUB_ENV"
      - name: Verify GPU source package builds and links
        run: cargo package --allow-dirty --features ${{ matrix.feature }}
      - name: Test standalone GPU package inference and safety
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          manifest="target/package/clap-cpp-${version}/Cargo.toml"
          cargo test --manifest-path "$manifest" --features ${{ matrix.feature }} --all-targets --locked
          cargo test --manifest-path "$manifest" --features ${{ matrix.feature }} --doc --locked
      - name: GPU-enabled text and audio inference
        run: cargo test --features ${{ matrix.feature }} --all-targets
      - name: GPU-enabled documentation tests
        run: cargo test --features ${{ matrix.feature }} --doc

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install build "scikit-build-core>=1.0" pytest "mypy>=1.8" "typing_extensions>=4.2"
      # build's default path builds the wheel FROM the sdist, exercising both.
      - name: Build source distribution and default-backend wheel
        run: python -m build python --outdir dist
      - name: Install wheel
        run: python -m pip install --no-deps --no-index --find-links dist clap-cpp
      - name: Test installed default-backend bindings
        run: python -m pytest python/tests -v

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    defaults:
      run:
        working-directory: node
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical oracle dependency
        run: python -m pip install numpy
      - name: Build default-backend bindings
        run: npm ci
      - name: Generate tiny models and test bindings
        run: |
          npm run test:fixtures
          npm test
          npm run test:types
          npm run test:packaging
      - name: Pack source distribution
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - name: Install and test source distribution
        run: |
          npm install --prefix installed ./artifacts/*.tgz
          CLAP_CPP_MODULE="$PWD/installed/node_modules/clap-cpp" npm test
          cd installed/node_modules/clap-cpp
          npm run test:fixtures
          npm test
