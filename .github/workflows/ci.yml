name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8
      - name: Check C/C++ formatting
        run: git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs -0 -r clang-format --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
          - os: macos-latest
            runtime: darwin-arm64
          - os: windows-latest
            runtime: win32-x64
          - os: windows-11-arm
            runtime: win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        if: matrix.os != 'windows-11-arm'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: matrix.os != 'windows-11-arm'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install FFmpeg for test fixtures
        if: matrix.os != 'windows-11-arm'
        uses: AnimMouse/setup-ffmpeg@v1
      - name: Install ARM64 FFmpeg for test fixtures
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64'
          Invoke-WebRequest 'https://github.com/tordona/ffmpeg-win-arm64/releases/download/9.0.2/ffmpeg-9.0.2-essentials-shared-win-arm64.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '909b9b6c3cd6ad670d9b0b651808a8fecfc22833b4d14b02c7c4de2ef398ac97') {
            throw 'FFmpeg archive checksum mismatch'
          }
          7z x $archive "-o$destination" -y
          (Get-ChildItem $destination -Filter ffmpeg.exe -Recurse).DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set macOS native deployment minimum
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          printf '%s\n' 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
      - name: build-libraries
        uses: ./.github/actions/build-libraries
        with:
          target: ${{ matrix.runtime }}
          targets: all
          cmake-args: >-
            -DBUILD_TESTING=ON -DCLAP_BUILD_CLI=ON
            ${{ matrix.os == 'windows-11-arm' && '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl' || '' }}
      - name: Test C++
        run: ctest --test-dir build/libraries -C Release --output-on-failure
      - name: Test native installation
        run: cmake --install build/libraries --config Release --prefix "${{ runner.temp }}/clap-install"
      - name: Install Python packaging and test dependencies
        if: matrix.os != 'windows-11-arm'
        run: python -m pip install build "scikit-build-core>=1.1.2" jinja2 packaging pytest "mypy>=1.8" "typing_extensions>=4.2" "huggingface-hub>=0.20"
      - name: Package Python with the shared runtime
        if: matrix.os != 'windows-11-arm'
        shell: bash
        run: |
          set -euo pipefail
          python -m build python --sdist --outdir python-dist
          mkdir -p build/python-package
          tar -xzf python-dist/*.tar.gz --strip-components=1 -C build/python-package
          cp -R "libraries/${{ matrix.runtime }}/clap_cpp/." build/python-package/clap_cpp/
          cp build/python-package/LICENSE build/python-package/clap_cpp/licenses/clap-cpp.txt
          python - <<'PY'
          from pathlib import Path
          import sys
          package = Path("build/python-package/clap_cpp")
          native = "clap.dll" if sys.platform == "win32" else ("libclap.dylib" if sys.platform == "darwin" else "libclap.so")
          runtime = package / native
          if not runtime.is_file() or not runtime.stat().st_size:
              raise SystemExit(f"Missing staged external runtime: {runtime}")
          magic = runtime.read_bytes()[:4]
          if not (magic == b"\x7fELF" if sys.platform.startswith("linux") else
                  magic[:2] == b"MZ" if sys.platform == "win32" else
                  magic in (b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf")):
              raise SystemExit(f"Invalid staged external runtime: {runtime}")
          notice = package / "licenses" / "clap-cpp.txt"
          if not notice.is_file() or not notice.read_text(encoding="utf-8").strip():
              raise SystemExit(f"Missing runtime notices: {notice}")
          PY
          python -m build build/python-package --wheel --outdir python-dist
          python -m pip install --no-deps --no-index --find-links python-dist clap-cpp
      - name: Test Python
        if: matrix.os != 'windows-11-arm'
        run: python -m pytest python/tests -v
      - name: Package Node with the shared runtime
        if: matrix.os != 'windows-11-arm'
        shell: bash
        working-directory: node
        run: |
          npm ci --force --ignore-scripts
          cp ../LICENSE LICENSE
          package="packages/${{ matrix.runtime }}"
          mkdir -p "$package/runtime" artifacts
          cp -R "../libraries/${{ matrix.runtime }}/." "$package/runtime/"
          cp ../LICENSE "$package/LICENSE"
          cp ../LICENSE "$package/runtime/clap_cpp/licenses/clap.txt"
          npm pack --workspace "$package" --include-workspace-root --pack-destination artifacts
      - name: Test Node
        if: matrix.os != 'windows-11-arm'
        shell: bash
        working-directory: node
        run: npm test

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: . -> target
          build-warnings: ""
      - name: Build configuration tests
        shell: bash
        run: |
          mkdir -p target
          rustc --edition=2021 --test rust/build.rs -o target/build-script-tests
          target/build-script-tests
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Default-backend inference and safety tests
        run: cargo test --all-targets
      - name: Compile-fail thread-safety contract
        run: cargo test --doc

  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        java: ['11', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: java/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure shared C API runtime
        run: >-
          cmake -S . -B build/java-native
          -DCMAKE_BUILD_TYPE=Release -DCLAP_BUILD_CLI=OFF -DBUILD_TESTING=OFF
          -DBUILD_SHARED_LIBS=ON -DCLAP_STATIC_DEPENDENCIES=ON -DGGML_NATIVE=OFF
          -DGGML_OPENMP=OFF -DCMAKE_INSTALL_LIBDIR=. -DCMAKE_INSTALL_BINDIR=.
      - name: Build shared C API runtime
        run: cmake --build build/java-native --config Release --parallel 3
      - name: Install shared C API runtime
        run: cmake --install build/java-native --config Release --component runtime --prefix "${{ github.workspace }}/build/java-native/runtime"
      - name: Generate tiny model and audio fixtures
        run: python java/tests/generate_fixtures.py
      - name: Verify Java bindings and package
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) library=libclap.so ;;
            macOS) library=libclap.dylib ;;
            Windows) library=clap.dll ;;
          esac
          mvn -B -f java/pom.xml "-Dclap.library.path=$GITHUB_WORKSPACE/build/java-native/runtime/$library" verify
          python java/tests/verify_package.py --library "$GITHUB_WORKSPACE/build/java-native/runtime/$library" --model java/target/fixtures/tiny-clap.gguf
