name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install FFmpeg for test fixtures
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          # Native ARM64 FFmpeg is only available on Linux; use x64 elsewhere.
          architecture: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/clap-install"
