name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install FFmpeg for test fixtures
        if: matrix.os != 'windows-11-arm'
        uses: AnimMouse/setup-ffmpeg@v1
      - name: Install ARM64 FFmpeg for test fixtures
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          Install-Module -Name Microsoft.WinGet.Client -Repository PSGallery -Force
          Repair-WinGetPackageManager -Latest -Force
          Write-Output "Winget Version: $(winget --version)"
          "$env:LOCALAPPDATA\Microsoft\WinGet\Links" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          winget install -e --id yt-dlp.FFmpeg --architecture arm64 --scope user --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.os == 'windows-11-arm' && '-T ClangCL' || '' }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/clap-install"
