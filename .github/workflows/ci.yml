name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8
      - name: Check C/C++ formatting
        run: git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs -0 -r clang-format --dry-run --Werror

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
          - os: macos-latest
            runtime: darwin-arm64
          - os: windows-latest
            runtime: win32-x64
          - os: windows-11-arm
            runtime: win32-arm64
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_S3_KEY_PREFIX: clap.cpp/
      SCCACHE_GHA_ENABLED: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        if: matrix.os != 'windows-11-arm'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: matrix.os != 'windows-11-arm'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install FFmpeg for test fixtures
        if: matrix.os != 'windows-11-arm'
        uses: AnimMouse/setup-ffmpeg@v1
      - name: Install ARM64 FFmpeg for test fixtures
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64'
          Invoke-WebRequest 'https://github.com/tordona/ffmpeg-win-arm64/releases/download/9.0.2/ffmpeg-9.0.2-essentials-shared-win-arm64.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '909b9b6c3cd6ad670d9b0b651808a8fecfc22833b4d14b02c7c4de2ef398ac97') {
            throw 'FFmpeg archive checksum mismatch'
          }
          7z x $archive "-o$destination" -y
          (Get-ChildItem $destination -Filter ffmpeg.exe -Recurse).DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set macOS native deployment minimum
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          printf '%s\n' 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
      - name: Configure remote compiler cache
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        shell: bash
        env:
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          printf '%s\n' "SCCACHE_BUCKET=$SCCACHE_BUCKET" "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT" "SCCACHE_REGION=$SCCACHE_REGION" >> "$GITHUB_ENV"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: build-libraries
        uses: ./.github/actions/build-libraries
        with:
          target: ${{ matrix.runtime }}
          targets: all
          cmake-args: >-
            -DBUILD_TESTING=ON -DCLAP_BUILD_CLI=ON -DGGML_CCACHE=OFF
            ${{ matrix.os == 'windows-11-arm' && '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl' || '' }}
      - name: Test C++
        run: ctest --test-dir build/libraries -C Release --output-on-failure
      - name: Install Python test dependencies
        if: matrix.os != 'windows-11-arm'
        run: python -m pip install pytest "huggingface-hub>=0.20"
      - name: Stage Python runtime
        if: matrix.os != 'windows-11-arm'
        shell: bash
        run: cmake --install build/libraries --config Release --component runtime --prefix "$GITHUB_WORKSPACE/python"
      - name: Test Python
        if: matrix.os != 'windows-11-arm'
        env:
          PYTHONPATH: python
        run: python -m pytest python/tests -v
      - name: Set up Node tests
        if: matrix.os != 'windows-11-arm'
        shell: bash
        working-directory: node
        run: |
          npm ci --force --ignore-scripts
          cmake --install ../build/libraries --config Release --component runtime --prefix "$GITHUB_WORKSPACE/node/packages/${{ matrix.runtime }}/runtime"
      - name: Test Node
        if: matrix.os != 'windows-11-arm'
        shell: bash
        working-directory: node
        run: npm test

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: sccache
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_S3_KEY_PREFIX: clap.cpp/
      SCCACHE_GHA_ENABLED: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      - name: Select Windows native compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COMPILER: ${{ runner.arch == 'ARM64' && 'clang-cl' || 'cl' }}
        run: |
          "CC=$env:COMPILER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$env:COMPILER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure remote compiler cache
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        shell: bash
        env:
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          printf '%s\n' "SCCACHE_BUCKET=$SCCACHE_BUCKET" "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT" "SCCACHE_REGION=$SCCACHE_REGION" >> "$GITHUB_ENV"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: . -> target
          build-warnings: ""
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
