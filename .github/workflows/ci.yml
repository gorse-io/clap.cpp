name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        # setup-ffmpeg's Linux download source (johnvansickle.com) is unavailable.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg on macOS and Windows
        if: runner.os != 'Linux'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          # setup-ffmpeg only provides x64 binaries on macOS and Windows.
          architecture: x64
      - name: Verify FFmpeg
        run: ffmpeg -version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/clap-install"
