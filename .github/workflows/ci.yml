name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8
      - name: Check C/C++ formatting
        run: git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs -0 -r clang-format --dry-run --Werror

  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release validator dependency
        run: python -m pip install packaging
      - name: Test release metadata and asset validation
        run: python -m unittest discover -s .github/scripts -v

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
          - os: macos-latest
            runtime: darwin-arm64
          - os: windows-latest
            runtime: win32-x64
          - os: windows-11-arm
            runtime: win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        if: matrix.os != 'windows-11-arm'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: matrix.os != 'windows-11-arm'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install FFmpeg for test fixtures
        if: matrix.os != 'windows-11-arm'
        uses: AnimMouse/setup-ffmpeg@v1
      - name: Install ARM64 FFmpeg for test fixtures
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64'
          Invoke-WebRequest 'https://github.com/tordona/ffmpeg-win-arm64/releases/download/9.0.2/ffmpeg-9.0.2-essentials-shared-win-arm64.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '909b9b6c3cd6ad670d9b0b651808a8fecfc22833b4d14b02c7c4de2ef398ac97') {
            throw 'FFmpeg archive checksum mismatch'
          }
          7z x $archive "-o$destination" -y
          (Get-ChildItem $destination -Filter ffmpeg.exe -Recurse).DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: build-libraries
        uses: ./.github/actions/build-libraries
        with:
          target: ${{ matrix.runtime }}
          targets: all
          cmake-args: >-
            -DBUILD_TESTING=ON -DCLAP_BUILD_CLI=ON
            ${{ matrix.os == 'windows-11-arm' && '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl' || '' }}
      - name: Test C++
        run: ctest --test-dir build/libraries -C Release --output-on-failure
      - name: Test native installation
        run: cmake --install build/libraries --config Release --prefix "${{ runner.temp }}/clap-install"
      - name: Install Python packaging and test dependencies
        if: matrix.os != 'windows-11-arm'
        run: python -m pip install build "scikit-build-core>=1.1.2" packaging pytest "mypy>=1.8" "typing_extensions>=4.2"
      - name: Package Python with the shared runtime
        if: matrix.os != 'windows-11-arm'
        shell: bash
        run: |
          python -m build python --sdist --outdir python-dist
          mkdir -p build/python-package
          tar -xzf python-dist/*.tar.gz --strip-components=1 -C build/python-package
          python python/stage_runtime.py build/python-package "libraries/${{ matrix.runtime }}"
          python -m build build/python-package --wheel --outdir python-dist
          python -m pip install --no-deps --no-index --find-links python-dist clap-cpp
      - name: Test Python
        if: matrix.os != 'windows-11-arm'
        run: python -m pytest python/tests -v
      - name: Package Node with the shared runtime
        if: matrix.os != 'windows-11-arm'
        shell: bash
        working-directory: node
        run: |
          npm ci --ignore-scripts
          python ../.github/scripts/pack-node.py --runtime-root ../libraries --target "${{ matrix.runtime }}"
          mkdir -p artifacts
          for package in dist/*; do npm pack "./$package" --pack-destination artifacts; done
          npm install --no-save --package-lock=false --ignore-scripts ./artifacts/gorse-clap-cpp-*.tgz
      - name: Test Node
        if: matrix.os != 'windows-11-arm'
        shell: bash
        working-directory: node
        run: |
          npm run test:fixtures
          npm test
          npm run test:types
          npm run test:packaging
      - name: Test npm platform selection and installed package
        if: matrix.os != 'windows-11-arm'
        shell: bash
        working-directory: node
        run: |
          python ../.github/scripts/test-node-install.py --artifacts artifacts --prefix installed
          CLAP_CPP_MODULE="$PWD/installed/node_modules/clap-cpp" npm test
          cd installed/node_modules/clap-cpp
          npm run test:fixtures
          npm test

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: . -> target
          build-warnings: ""
      - name: Build configuration tests
        shell: bash
        run: |
          mkdir -p target
          rustc --edition=2021 --test rust/build.rs -o target/build-script-tests
          target/build-script-tests
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Default-backend inference and safety tests
        run: cargo test --all-targets
      - name: Compile-fail thread-safety contract
        run: cargo test --doc
      - name: Check package inventory and pinned sources
        run: python -m unittest discover -s rust/tests -p test_package.py -v
      - name: Verify standalone package build
        run: cargo package --allow-dirty
      - name: Test standalone package inference and safety
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          manifest="target/package/clap-cpp-${version}/Cargo.toml"
          cargo test --manifest-path "$manifest" --all-targets --locked
          cargo test --manifest-path "$manifest" --doc --locked
          python -m unittest discover -s "$(dirname "$manifest")/rust/tests" -p test_package.py -v
      - name: Recheck checkout after package verification
        run: cargo test --all-targets --locked

  rust-gpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            feature: vulkan
          - os: macos-latest
            feature: metal
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache-workspaces: . -> target
          build-warnings: ""
      - name: Install Vulkan SDK and software driver
        if: matrix.feature == 'vulkan'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers mesa-vulkan-drivers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "GGML_VK_VISIBLE_DEVICES=0" >> "$GITHUB_ENV"
      - name: Verify GPU source package builds and links
        run: cargo package --allow-dirty --features ${{ matrix.feature }}
      - name: Test standalone GPU package inference and safety
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          manifest="target/package/clap-cpp-${version}/Cargo.toml"
          cargo test --manifest-path "$manifest" --features ${{ matrix.feature }} --all-targets --locked
          cargo test --manifest-path "$manifest" --features ${{ matrix.feature }} --doc --locked
      - name: GPU-enabled text and audio inference
        run: cargo test --features ${{ matrix.feature }} --all-targets
      - name: GPU-enabled documentation tests
        run: cargo test --features ${{ matrix.feature }} --doc
