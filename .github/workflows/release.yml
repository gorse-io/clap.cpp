name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: clap-macos-arm64
            binary: build/clap
            preset: macos-arm64
          - os: windows-2022
            asset: clap-windows-amd64-cpu.exe
            binary: build/Release/clap.exe
            preset: windows-amd64-cpu
          - os: windows-11-arm
            asset: clap-windows-arm64-cpu.exe
            binary: build/Release/clap.exe
            preset: windows-arm64-cpu
          - os: ubuntu-22.04
            asset: clap-linux-amd64-cpu
            binary: build/clap
            preset: linux-amd64-cpu
          - os: ubuntu-22.04-arm
            asset: clap-linux-arm64-cpu
            binary: build/clap
            preset: linux-arm64-cpu
          - os: ubuntu-24.04
            asset: clap-linux-riscv64-cpu
            binary: build/clap
            target: riscv64
            preset: linux-riscv64-cpu
          - os: ubuntu-24.04
            asset: clap-linux-loong64-cpu
            binary: build/clap
            target: loongarch64
            preset: linux-loong64-cpu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross-compilation tools
        if: matrix.target != ''
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: gcc-14-${{ matrix.target }}-linux-gnu g++-14-${{ matrix.target }}-linux-gnu
          version: cross-${{ matrix.os }}-${{ matrix.target }}-gcc14-v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build build --config Release --target clap-cli --parallel
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mv "$BINARY" "$ASSET"
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber

  build-cuda:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: clap-windows-amd64-cuda12.9.zip
            binary: build/clap-cuda.zip
            preset: windows-amd64-cuda12.9
          - os: ubuntu-22.04
            asset: clap-linux-amd64-cuda12.9
            binary: build/clap
            preset: linux-amd64-cuda12.9
          - os: ubuntu-22.04-arm
            asset: clap-linux-arm64-cuda12.9
            binary: build/clap
            preset: linux-arm64-cuda12.9
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CUDA 12.9 build dependencies
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.2'
          method: network
          sub-packages: ${{ runner.os == 'Windows' && '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]' || '["nvcc"]' }}
          non-cuda-sub-packages: ${{ runner.os == 'Linux' && '["libcublas-dev"]' || '[]' }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build build --config Release --target clap-cli --parallel 1

      # CUDA on Windows has no static cuBLAS library. Ship its runtime DLLs
      # beside clap.exe rather than publishing an unusable standalone binary.
      - name: Package Windows CUDA release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          $stage = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/clap-cuda"
          Copy-Item 'build/Release/clap.exe' "$stage/clap.exe"
          foreach ($dll in @('cublas64_12.dll', 'cublasLt64_12.dll')) {
            Copy-Item "$env:CUDA_PATH/bin/$dll" $stage
          }
          Compress-Archive -Path "$stage/*" -DestinationPath $env:BINARY

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mv "$BINARY" "$ASSET"
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber

  build-vulkan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: clap-windows-amd64-vulkan.exe
            binary: build/Release/clap.exe
            preset: windows-amd64-vulkan
          - os: windows-11-arm
            asset: clap-windows-arm64-vulkan.exe
            binary: build/Release/clap.exe
            preset: windows-arm64-vulkan
          - os: ubuntu-24.04
            asset: clap-linux-amd64-vulkan
            binary: build/clap
            preset: linux-amd64-vulkan
          - os: ubuntu-24.04-arm
            asset: clap-linux-arm64-vulkan
            binary: build/clap
            preset: linux-arm64-vulkan
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux Vulkan build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libvulkan-dev glslc spirv-headers
          version: vulkan-${{ matrix.os }}-${{ runner.arch }}-v1
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_VERSION: '1.4.321.1'
        run: |
          $installer = "$env:RUNNER_TEMP/VulkanSDK-Installer.exe"
          curl.exe --fail --location --retry 3 --output $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan SDK download failed' }
          $arguments = @('--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ('${{ runner.arch }}' -eq 'ARM64') { $arguments += 'com.lunarg.vulkan.arm64' }
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($process.ExitCode)" }
          "VULKAN_SDK=C:/VulkanSDK/$env:VULKAN_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:/VulkanSDK/$env:VULKAN_VERSION/Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build build --config Release --target clap-cli --parallel
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mv "$BINARY" "$ASSET"
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber

  build-rocm:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Add ROCm 6.4.3 package repository
        run: |
          curl -fsSL --retry 3 https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/rocm.gpg > /dev/null
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4.3 jammy main' | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm
          sudo apt-get update
      - name: Install ROCm build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: hip-dev hipblas-dev rocblas-dev rocm-device-libs
          version: rocm-6.4.3-ubuntu-22.04-v2
      - name: Restore ROCm installation prefix
        run: |
          # The APT cache restores package files, not rocm-core's postinst link.
          sudo ln -sfn /opt/rocm-6.4.3 /opt/rocm
          test -x /opt/rocm/llvm/bin/clang++
      - name: Configure
        run: cmake --preset linux-amd64-rocm
      - name: Build
        run: cmake --build build --config Release --target clap-cli --parallel 1
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mv build/clap clap-linux-amd64-rocm
          gh release upload "$RELEASE_TAG" clap-linux-amd64-rocm --clobber
