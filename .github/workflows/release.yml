name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-python-sdist:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install packaging tools
      run: python -m pip install build jinja2 packaging twine
    - name: Set Python package version from release tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        from jinja2 import Environment, StrictUndefined
        from packaging.version import Version

        version = str(Version(os.environ['RELEASE_TAG']))
        source = Path('python')
        template = Environment(undefined=StrictUndefined, keep_trailing_newline=True).from_string(
            (source / 'pyproject.toml.j2').read_text(encoding='utf-8'))
        (source / 'pyproject.toml').write_text(
            template.render(backend='cpu', version=version), encoding='utf-8')
        PY
    - name: Build source distribution
      run: python -m build python --sdist --outdir dist
    - name: Generate GPU source distributions from the canonical CPU source distribution
      shell: bash
      run: |
        set -euo pipefail
        mkdir python-dist
        tar -xzf dist/clap_cpp-[0-9]*.tar.gz --strip-components=1 -C python-dist
        for backend in cuda rocm vulkan; do
          destination="$RUNNER_TEMP/clap-$backend"
          package="clap_cpp_$backend"
          mkdir -p "$destination/$package"
          cp python-dist/{README.md,LICENSE} "$destination/"
          cp python-dist/clap_cpp/{clap.py,clap.pyi,py.typed} "$destination/$package/"
          printf '"""Native %s runtime; import clap_cpp for the public API."""\n' "$backend" > "$destination/$package/__init__.py"
          BACKEND="$backend" DESTINATION="$destination" python - <<'PY'
        import os
        from pathlib import Path
        import tomllib
        from jinja2 import Environment, StrictUndefined
        source = Path('python-dist')
        version = tomllib.loads((source / 'pyproject.toml').read_text(encoding='utf-8'))['project']['version']
        template = Environment(undefined=StrictUndefined, keep_trailing_newline=True).from_string(
            Path('python/pyproject.toml.j2').read_text(encoding='utf-8'))
        (Path(os.environ['DESTINATION']) / 'pyproject.toml').write_text(
            template.render(backend=os.environ['BACKEND'], version=version), encoding='utf-8')
        PY
          python -m build --sdist "$destination" --outdir dist
        done
    - name: Check source distribution
      run: python -m twine check --strict dist/*
    - uses: actions/upload-artifact@v4
      with:
        name: python-sdists
        path: dist/*.tar.gz
        if-no-files-found: error
  build-libraries:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          target: linux-x64
          manylinux-arch: x86_64
        - os: ubuntu-24.04-arm
          target: linux-arm64
          manylinux-arch: aarch64
        - os: macos-15
          target: darwin-arm64
        - os: windows-2022
          target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Compile Linux runtime at the manylinux_2_28 glibc floor
      if: runner.os == 'Linux'
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        MANYLINUX_ARCH: ${{ matrix.manylinux-arch }}
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD:/project" -w /project \
          -e TARGET quay.io/pypa/manylinux_2_28_"$MANYLINUX_ARCH" \
          bash -euxo pipefail -c '
            export PATH=/opt/python/cp311-cp311/bin:$PATH
            python -m pip install ninja
            cmake --preset libraries -DGGML_METAL=OFF
            cmake --build build/libraries --config Release --target clap --parallel 4
            cmake --install build/libraries --config Release --component runtime --prefix "/project/libraries/$TARGET"
            cp LICENSE "libraries/$TARGET/clap_cpp/licenses/clap.txt"
          '
    - name: Compile host shared runtime
      if: runner.os != 'Linux'
      uses: ./.github/actions/build-libraries
      with:
        target: ${{ matrix.target }}
        cmake-args: ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0' || '' }}
    - uses: actions/upload-artifact@v4
      with:
        name: libraries-${{ matrix.target }}
        path: libraries/${{ matrix.target }}/
        if-no-files-found: error

  build-python-wheels:
    needs: [build-python-sdist, build-libraries]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          target: linux-x64
        - os: ubuntu-24.04-arm
          target: linux-arm64
        - os: macos-15
          target: darwin-arm64
        - os: windows-2022
          target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/download-artifact@v4
      with:
        name: python-sdists
        path: sdist
    - name: Extract source distribution
      shell: bash
      run: |
        mkdir python-dist
        tar -xzf sdist/clap_cpp-[0-9]*.tar.gz --strip-components=1 -C python-dist
    - uses: actions/download-artifact@v4
      with:
        name: libraries-${{ matrix.target }}
        path: python-dist/external-runtime
    - name: Copy external runtime into the CPU wrapper project
      shell: bash
      run: |
        set -euo pipefail
        cp -R python-dist/external-runtime/clap_cpp/. python-dist/clap_cpp/
        cp python-dist/LICENSE python-dist/clap_cpp/licenses/clap-cpp.txt
        python - <<'PY'
        from pathlib import Path
        import sys
        package = Path("python-dist/clap_cpp")
        native = "clap.dll" if sys.platform == "win32" else ("libclap.dylib" if sys.platform == "darwin" else "libclap.so")
        runtime = package / native
        if not runtime.is_file() or not runtime.stat().st_size:
            raise SystemExit(f"Missing staged external runtime: {runtime}")
        magic = runtime.read_bytes()[:4]
        if not (magic == b"\x7fELF" if sys.platform.startswith("linux") else
                magic[:2] == b"MZ" if sys.platform == "win32" else
                magic in (b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf")):
            raise SystemExit(f"Invalid staged external runtime: {runtime}")
        notice = package / "licenses" / "clap-cpp.txt"
        if not notice.is_file() or not notice.read_text(encoding="utf-8").strip():
            raise SystemExit(f"Missing runtime notices: {notice}")
        PY
    - name: Supply metadata template from the exact release checkout
      shell: bash
      run: |
        cp python/pyproject.toml.j2 python-dist/pyproject.toml.j2
    - name: Package CPU wheels from canonical wrapper sdist and shared runtime
      uses: pypa/cibuildwheel@v4.3.4
      with:
        package-dir: python-dist
        output-dir: dist
      env:
        CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
        CIBW_SKIP: '*-musllinux_* *-win32'
        CIBW_ARCHS: native
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
    - uses: actions/upload-artifact@v4
      with:
        name: python-wheels-${{ matrix.os }}
        path: dist/*.whl
        if-no-files-found: error
  python-build-cuda:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-22.04
        # ctypes payloads have no CPython ABI: one wheel per backend/platform.
        python:
        - '3.11'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_GHA_ENABLED: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache
        -DCMAKE_HIP_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=OFF -DGGML_CCACHE=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_METAL=OFF
      SCCACHE_S3_KEY_PREFIX: clap.cpp/python/cuda/${{ matrix.os }}/${{ matrix.python }}/
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/download-artifact@v4
      with:
        name: python-sdists
        path: sdists
    - name: Extract canonical CUDA source distribution
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/clap-cuda"
        tar -xzf sdists/clap_cpp_cuda-*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/clap-cuda"
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Install CUDA 12.9 build dependencies (same as release.yml)
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: 12.9.2
        method: network
        sub-packages: '["nvcc"]'
        non-cuda-sub-packages: '["libcublas-dev"]'
    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0
    - name: Install build and wheel repair tools
      run: |
        set -euo pipefail
        python -m pip install build ninja 'auditwheel>=6.4,<7' patchelf
    - name: Compile external CUDA shared runtime
      run: |
        set -euo pipefail
        cmake --preset libraries -B build/python-cuda $CMAKE_ARGS \
          -DGGML_CUDA=ON -DGGML_STATIC=ON \
          '-DCMAKE_CUDA_ARCHITECTURES=50-virtual;61-virtual;70-virtual;75-virtual;80-virtual;86-real;89-real;90;120a-real;121a-real'
        cmake --build build/python-cuda --config Release --target clap --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        cmake --install build/python-cuda --config Release --component runtime --prefix "$PWD/libraries/cuda"
    - name: Stage runtime and package canonical CUDA wrapper sdist
      run: |
        set -euo pipefail
        cp -R "libraries/cuda/clap_cpp/." "$RUNNER_TEMP/clap-cuda/clap_cpp_cuda/"
        cp "$RUNNER_TEMP/clap-cuda/LICENSE" "$RUNNER_TEMP/clap-cuda/clap_cpp_cuda/licenses/clap-cpp.txt"
        python - <<'PY'
        from pathlib import Path
        import sys
        package = Path(__import__("os").environ["RUNNER_TEMP"]) / "clap-cuda" / "clap_cpp_cuda"
        native = "clap.dll" if sys.platform == "win32" else ("libclap.dylib" if sys.platform == "darwin" else "libclap.so")
        runtime = package / native
        if not runtime.is_file() or not runtime.stat().st_size:
            raise SystemExit(f"Missing staged external runtime: {runtime}")
        magic = runtime.read_bytes()[:4]
        if not (magic == b"\x7fELF" if sys.platform.startswith("linux") else
                magic[:2] == b"MZ" if sys.platform == "win32" else
                magic in (b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf")):
            raise SystemExit(f"Invalid staged external runtime: {runtime}")
        notice = package / "licenses" / "clap-cpp.txt"
        if not notice.is_file() or not notice.read_text(encoding="utf-8").strip():
            raise SystemExit(f"Missing runtime notices: {notice}")
        PY
        python -m build --wheel "$RUNNER_TEMP/clap-cuda" --outdir raw
    - name: Repair CUDA wheel
      run: |
        set -euo pipefail
        auditwheel repair --plat manylinux_2_35_x86_64 --only-plat \
          --exclude libcuda.so.1 --wheel-dir wheelhouse raw/*.whl
    - uses: actions/upload-artifact@v4
      with:
        name: python-cuda-${{ matrix.os }}-${{ matrix.python }}
        path: wheelhouse/*.whl
        if-no-files-found: error
    needs: build-python-sdist
    permissions:
      contents: read
  python-build-vulkan:
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_GHA_ENABLED: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache
        -DCMAKE_HIP_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=OFF -DGGML_CCACHE=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_METAL=OFF
      SCCACHE_S3_KEY_PREFIX: clap.cpp/python/vulkan/${{ matrix.os }}/${{ matrix.python }}/
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        # ctypes payloads have no CPython ABI: one wheel per backend/platform.
        python:
        - '3.11'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/download-artifact@v4
      with:
        name: python-sdists
        path: sdists
    - name: Extract canonical VULKAN source distribution
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/clap-vulkan"
        tar -xzf sdists/clap_cpp_vulkan-*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/clap-vulkan"
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Install Vulkan build dependencies (same as release.yml)
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: libvulkan-dev glslc spirv-headers
        version: vulkan-${{ matrix.os }}-${{ runner.arch }}-v1
    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0
    - name: Install build and wheel repair tools
      run: |
        set -euo pipefail
        python -m pip install build ninja 'auditwheel>=6.4,<7' patchelf
    - name: Compile external VULKAN shared runtime
      run: |
        set -euo pipefail
        cmake --preset libraries -B build/python-vulkan $CMAKE_ARGS \
          -DGGML_VULKAN=ON
        cmake --build build/python-vulkan --config Release --target clap --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        cmake --install build/python-vulkan --config Release --component runtime --prefix "$PWD/libraries/vulkan"
    - name: Stage runtime and package canonical VULKAN wrapper sdist
      run: |
        set -euo pipefail
        cp -R "libraries/vulkan/clap_cpp/." "$RUNNER_TEMP/clap-vulkan/clap_cpp_vulkan/"
        cp "$RUNNER_TEMP/clap-vulkan/LICENSE" "$RUNNER_TEMP/clap-vulkan/clap_cpp_vulkan/licenses/clap-cpp.txt"
        python - <<'PY'
        from pathlib import Path
        import sys
        package = Path(__import__("os").environ["RUNNER_TEMP"]) / "clap-vulkan" / "clap_cpp_vulkan"
        native = "clap.dll" if sys.platform == "win32" else ("libclap.dylib" if sys.platform == "darwin" else "libclap.so")
        runtime = package / native
        if not runtime.is_file() or not runtime.stat().st_size:
            raise SystemExit(f"Missing staged external runtime: {runtime}")
        magic = runtime.read_bytes()[:4]
        if not (magic == b"\x7fELF" if sys.platform.startswith("linux") else
                magic[:2] == b"MZ" if sys.platform == "win32" else
                magic in (b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf")):
            raise SystemExit(f"Invalid staged external runtime: {runtime}")
        notice = package / "licenses" / "clap-cpp.txt"
        if not notice.is_file() or not notice.read_text(encoding="utf-8").strip():
            raise SystemExit(f"Missing runtime notices: {notice}")
        PY
        python -m build --wheel "$RUNNER_TEMP/clap-vulkan" --outdir raw
    - name: Repair Vulkan wheel (Ubuntu 24.04 glibc floor)
      run: |
        set -euo pipefail
        auditwheel repair --plat manylinux_2_39_x86_64 --only-plat \
          --exclude libvulkan.so.1 --wheel-dir wheelhouse raw/*.whl
    - uses: actions/upload-artifact@v4
      with:
        name: python-vulkan-${{ matrix.os }}-${{ matrix.python }}
        path: wheelhouse/*.whl
        if-no-files-found: error
    needs: build-python-sdist
    permissions:
      contents: read
  python-build-rocm:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-22.04
        # ctypes payloads have no CPython ABI: one wheel per backend/platform.
        python:
        - '3.11'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_GHA_ENABLED: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache
        -DCMAKE_HIP_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=OFF -DGGML_CCACHE=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_METAL=OFF
      SCCACHE_S3_KEY_PREFIX: clap.cpp/python/rocm/${{ matrix.os }}/${{ matrix.python }}/
      CMAKE_PREFIX_PATH: /opt/rocm
      LD_LIBRARY_PATH: /opt/rocm/lib:/opt/rocm/lib64
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/download-artifact@v4
      with:
        name: python-sdists
        path: sdists
    - name: Extract canonical ROCM source distribution
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/clap-rocm"
        tar -xzf sdists/clap_cpp_rocm-*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/clap-rocm"
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Add ROCm 6.4.3 package repository (same as release.yml)
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/rocm.gpg > /dev/null
        echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4.3 jammy main' | sudo tee /etc/apt/sources.list.d/rocm.list
        printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm
        sudo apt-get update
    - name: Install ROCm build dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: hip-dev hipblas-dev rocblas-dev rocm-device-libs
        version: rocm-6.4.3-ubuntu-22.04-v2
    - name: Restore ROCm installation prefix
      run: |
        set -euo pipefail
        sudo ln -sfn /opt/rocm-6.4.3 /opt/rocm
        test -x /opt/rocm/llvm/bin/clang++
    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0
    - name: Install build and wheel repair tools
      run: |
        set -euo pipefail
        python -m pip install build ninja 'auditwheel>=6.4,<7' patchelf
    - name: Compile external ROCM shared runtime
      run: |
        set -euo pipefail
        cmake --preset libraries -B build/python-rocm $CMAKE_ARGS \
          -DGGML_HIP=ON \
          -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
          '-DCMAKE_HIP_ARCHITECTURES=gfx908;gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1200;gfx1201' \
          -DCMAKE_INSTALL_RPATH=/opt/rocm/lib \
          -DGGML_HIP_RCCL=OFF -DGGML_STATIC=OFF
        cmake --build build/python-rocm --config Release --target clap --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        cmake --install build/python-rocm --config Release --component runtime --prefix "$PWD/libraries/rocm"
    - name: Stage runtime and package canonical ROCM wrapper sdist
      run: |
        set -euo pipefail
        cp -R "libraries/rocm/clap_cpp/." "$RUNNER_TEMP/clap-rocm/clap_cpp_rocm/"
        cp "$RUNNER_TEMP/clap-rocm/LICENSE" "$RUNNER_TEMP/clap-rocm/clap_cpp_rocm/licenses/clap-cpp.txt"
        python - <<'PY'
        from pathlib import Path
        import sys
        package = Path(__import__("os").environ["RUNNER_TEMP"]) / "clap-rocm" / "clap_cpp_rocm"
        native = "clap.dll" if sys.platform == "win32" else ("libclap.dylib" if sys.platform == "darwin" else "libclap.so")
        runtime = package / native
        if not runtime.is_file() or not runtime.stat().st_size:
            raise SystemExit(f"Missing staged external runtime: {runtime}")
        magic = runtime.read_bytes()[:4]
        if not (magic == b"\x7fELF" if sys.platform.startswith("linux") else
                magic[:2] == b"MZ" if sys.platform == "win32" else
                magic in (b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf")):
            raise SystemExit(f"Invalid staged external runtime: {runtime}")
        notice = package / "licenses" / "clap-cpp.txt"
        if not notice.is_file() or not notice.read_text(encoding="utf-8").strip():
            raise SystemExit(f"Missing runtime notices: {notice}")
        PY
        python -m build --wheel "$RUNNER_TEMP/clap-rocm" --outdir raw
    - name: Repair ROCm wheel, retaining system ROCm runtime
      run: |
        set -euo pipefail
        mkdir -p wheelhouse
        python - <<'PY'
        import pathlib
        import re
        import subprocess
        import sys
        names = set()
        root = pathlib.Path('/opt/rocm-6.4.3')
        for library in root.rglob('*.so*'):
            if not library.is_file():
                continue
            result = subprocess.run(['readelf', '-d', str(library)], capture_output=True, text=True)
            if result.returncode == 0:
                names.update(re.findall(r'\(SONAME\).*?\[(.*?)\]', result.stdout))
        if not {'libamdhip64.so.6', 'libhipblas.so.2', 'librocblas.so.4'} <= names:
            sys.exit('Expected ROCm runtime SONAMEs missing; inspect SDK installation')
        pathlib.Path('wheelhouse/ROCM-6.4.3-EXCLUDED-SONAMES.txt').write_text('\n'.join(sorted(names)) + '\n')
        command = ['auditwheel', 'repair', '--plat', 'manylinux_2_35_x86_64', '--only-plat', '--wheel-dir', 'wheelhouse']
        for name in sorted(names):
            command.extend(['--exclude', name])
        wheels = list(pathlib.Path('raw').glob('*.whl'))
        if len(wheels) != 1:
            sys.exit(f'Expected one raw wheel, got {len(wheels)}')
        subprocess.run(command + [str(wheels[0])], check=True)
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: python-rocm-${{ matrix.os }}-${{ matrix.python }}
        path: |
          wheelhouse/*.whl
          wheelhouse/ROCM-6.4.3-EXCLUDED-SONAMES.txt
        if-no-files-found: error
    needs: build-python-sdist
    permissions:
      contents: read
  python-prepare-pypi:
    needs:
    - build-python-sdist
    - build-python-wheels
    - python-build-cuda
    - python-build-vulkan
    - python-build-rocm
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: python-*
        path: artifacts
        merge-multiple: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate Python packages for PyPI
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install packaging
        python - <<'PY'
        from collections import Counter
        import pathlib
        import shutil
        import tarfile
        import zipfile
        from packaging.utils import parse_wheel_filename, parse_sdist_filename
        root = pathlib.Path('artifacts')
        dist = pathlib.Path('dist')
        dist.mkdir()
        expected = Counter()
        for platform in ('linux-x86_64', 'linux-aarch64', 'macosx-arm64', 'win-amd64'):
            expected[('clap-cpp', 'py3', platform)] += 1
        for backend in ('cuda', 'rocm', 'vulkan'):
            expected[(f'clap-cpp-{backend}', 'py3', 'linux-x86_64')] += 1
        actual = Counter()
        versions = set()
        for wheel in root.rglob('*.whl'):
            name, version, _, tags = parse_wheel_filename(wheel.name)
            versions.add(version)
            keys = set()
            for tag in tags:
                if tag.interpreter != 'py3' or tag.abi != 'none':
                    raise SystemExit(f'Unexpected Python/ABI tags (expected py3-none): {wheel.name}')
                if tag.platform.startswith('linux_'):
                    raise SystemExit(f'Unrepaired Linux wheel: {wheel.name}')
                if tag.platform.startswith('manylinux_') and tag.platform.endswith(('_x86_64', '_aarch64')):
                    platform = 'linux-aarch64' if tag.platform.endswith('_aarch64') else 'linux-x86_64'
                elif tag.platform.startswith('macosx_') and tag.platform.endswith('_arm64'):
                    platform = 'macosx-arm64'
                elif tag.platform == 'win_amd64':
                    platform = 'win-amd64'
                else:
                    raise SystemExit(f'Unexpected platform: {tag}')
                keys.add((name, tag.interpreter, platform))
            if len(keys) != 1:
                raise SystemExit(f'Ambiguous wheel: {wheel.name}')
            actual.update(keys)
            with zipfile.ZipFile(wheel) as archive:
                package = name.replace('-', '_')
                entries = set(archive.namelist())
                if any(entry.endswith('.j2') for entry in entries):
                    raise SystemExit(f'Wheel contains Jinja template: {wheel.name}')
                if any('tests' in pathlib.PurePosixPath(entry).parts for entry in entries):
                    raise SystemExit(f'Wheel contains tests: {wheel.name}')
                if f'{package}/clap.py' not in entries:
                    raise SystemExit(f'Missing Python ctypes wrapper: {wheel.name}')
                native = ('clap.dll' if platform == 'win-amd64' else
                          'libclap.dylib' if platform == 'macosx-arm64' else 'libclap.so')
                if f'{package}/{native}' not in entries:
                    raise SystemExit(f'Missing package-local native library {package}/{native}: {wheel.name}')
                payload = archive.read(f'{package}/{native}')
                valid = (payload.startswith(b'\x7fELF') if platform.startswith('linux-') else
                         payload.startswith(b'MZ') if platform == 'win-amd64' else
                         payload[:4] in (b'\xcf\xfa\xed\xfe', b'\xfe\xed\xfa\xcf'))
                if not valid:
                    raise SystemExit(f'Invalid package-local native library: {wheel.name}')
                notice = f'{package}/licenses/clap-cpp.txt'
                if notice not in entries or not archive.read(notice).strip():
                    raise SystemExit(f'Missing runtime notices: {wheel.name}')
            if (dist / wheel.name).exists():
                raise SystemExit(f'Duplicate release asset: {wheel.name}')
            shutil.copy2(wheel, dist)
        if actual != expected:
            raise SystemExit(f'Wheel matrix mismatch: missing={expected-actual}, extra={actual-expected}')
        sdists = list(root.rglob('*.tar.gz'))
        names = Counter()
        for source in sdists:
            name, version = parse_sdist_filename(source.name)
            names[name] += 1
            versions.add(version)
            with tarfile.open(source) as archive:
                entries = {entry.name.split('/', 1)[1] for entry in archive if '/' in entry.name and entry.isfile()}
                package = name.replace('-', '_')
                if any('tests' in pathlib.PurePosixPath(entry).parts for entry in entries):
                    raise SystemExit(f'Sdist contains tests: {source.name}')
                if any(entry.endswith('.j2') for entry in entries):
                    raise SystemExit(f'Sdist contains Jinja template: {source.name}')
                required = {'pyproject.toml', 'README.md', 'LICENSE',
                            f'{package}/__init__.py', f'{package}/clap.py', f'{package}/clap.pyi', f'{package}/py.typed'}
                if not required <= entries:
                    raise SystemExit(f'Sdist missing wrapper or packaging input: {source.name}: {required - entries}')
                if any(entry.startswith(('native/', 'cmake/')) or
                       pathlib.PurePosixPath(entry).name == 'CMakeLists.txt' or
                       entry.endswith(('.so', '.dylib', '.dll', '.pyd', '.cpp', '.c', '.h'))
                       for entry in entries):
                    raise SystemExit(f'Sdist contains native sources or compiled runtime: {source.name}')
            if (dist / source.name).exists():
                raise SystemExit(f'Duplicate release asset: {source.name}')
            shutil.copy2(source, dist)
        if names != Counter({'clap-cpp': 1, 'clap-cpp-cuda': 1, 'clap-cpp-rocm': 1, 'clap-cpp-vulkan': 1}) or len(versions) != 1:
            raise SystemExit(f'Sdist names/version mismatch: {names}, {versions}')
        manifests = list(root.rglob('ROCM-6.4.3-EXCLUDED-SONAMES.txt'))
        if len(manifests) != 1:
            raise SystemExit('Expected exactly one ROCm exclusion manifest')
        print(f'Validated {sum(actual.values())} wheels and {len(sdists)} sdists; version {next(iter(versions))}')
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: python-pypi
        path: |
          dist/*.whl
          dist/*.tar.gz
        if-no-files-found: error
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_GHA_ENABLED: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache
        -DCMAKE_HIP_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=OFF -DGGML_CCACHE=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_METAL=OFF
  python-publish-pypi:
    needs: python-prepare-pypi
    if: github.event.release.prerelease == false
    runs-on: ubuntu-22.04
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-pypi
        path: dist
    - name: Publish base package and GPU extras
      uses: pypa/gh-action-pypi-publish@release/v1
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_GHA_ENABLED: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache
        -DCMAKE_HIP_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=OFF -DGGML_CCACHE=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_METAL=OFF

  build-rust:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache-workspaces: . -> target
          build-warnings: ""
      - name: Install cargo set-version
        run: cargo install cargo-edit --locked --no-default-features --features set-version
      - name: Set Rust package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$version" == *+* ]]; then
            echo "::error::Release tags with build metadata are not supported by npm"
            exit 1
          fi
          cargo set-version -- "$version"
      - name: Build and verify Rust source distribution
        run: cargo package --allow-dirty
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate
          path: target/package/*.crate
          if-no-files-found: error

  test-rust:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    env:
      CARGO_BUILD_JOBS: 4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
          build-warnings: ""
      - name: Test Rust checkout
        run: |
          cargo test --all-targets --locked
          cargo test --doc --locked

  publish-crates-io:
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    needs: [build-rust, test-rust]
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/clap-cpp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate
          path: dist
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
          build-warnings: ""
      - name: Extract verified crate outside the checkout
        run: |
          mkdir "$RUNNER_TEMP/package"
          tar -xzf dist/*.crate --strip-components=1 -C "$RUNNER_TEMP/package"
      - uses: rust-lang/crates-io-auth-action@v1
        if: env.CARGO_REGISTRY_TOKEN == ''
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path "$RUNNER_TEMP/package/Cargo.toml" --locked --no-verify

  build-node:
    needs: build-libraries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    defaults:
      run:
        shell: bash
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: libraries-*
          path: node/runtime
          merge-multiple: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set npm package versions from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          npm version --workspaces --include-workspace-root --no-git-tag-version \
            --allow-same-version --ignore-scripts --workspaces-update=false -- "$version"
          if [[ "$(node -p 'require("./package.json").version')" != "$version" ]]; then
            echo "::error::Release tag must be a canonical SemVer without build metadata"
            exit 1
          fi
          for target in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            npm pkg set "optionalDependencies.@gorse/clap-cpp-$target=$version"
          done
          npm install --package-lock-only --ignore-scripts --force --offline --no-audit --no-fund
          npm_tag=latest
          if [[ "$version" == *-* ]]; then
            npm_tag=next
          fi
          echo "npm-tag=$npm_tag" >> "$GITHUB_OUTPUT"
      - name: Copy external runtimes into platform workspaces
        run: |
          set -euo pipefail
          cp ../LICENSE LICENSE
          for target in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            package="packages/$target"
            mkdir -p "$package/runtime"
            cp -R "runtime/libraries-$target/." "$package/runtime/"
            cp ../LICENSE "$package/LICENSE"
            cp ../LICENSE "$package/runtime/clap_cpp/licenses/clap.txt"
          done
      - name: Pack main and all optional runtime workspaces
        run: |
          mkdir -p artifacts
          npm pack --workspaces --include-workspace-root --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: node-package
          path: node/artifacts/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: build-node
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/clap-cpp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-package
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || needs.build-node.outputs.npm-tag }}
        run: |
          # All runtime packages must be available before publishing the wrapper.
          for package in ./dist/gorse-clap-cpp-*.tgz; do
            npm publish "$package" --provenance --access public --tag "$NPM_TAG"
          done
          npm publish ./dist/clap-cpp-*.tgz --provenance --access public --tag "$NPM_TAG"

  build-cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: clap-macos-arm64
            binary: build/clap
            preset: macos-arm64
          - os: windows-2022
            asset: clap-windows-amd64-cpu.exe
            binary: build/Release/clap.exe
            preset: windows-amd64-cpu
          - os: windows-11-arm
            asset: clap-windows-arm64-cpu.exe
            binary: build/Release/clap.exe
            preset: windows-arm64-cpu
          - os: ubuntu-22.04
            asset: clap-linux-amd64-cpu
            binary: build/clap
            preset: linux-amd64-cpu
          - os: ubuntu-22.04-arm
            asset: clap-linux-arm64-cpu
            binary: build/clap
            preset: linux-arm64-cpu
          - os: ubuntu-24.04
            asset: clap-linux-riscv64-cpu
            binary: build/clap
            target: riscv64
            preset: linux-riscv64-cpu
          - os: ubuntu-24.04
            asset: clap-linux-loong64-cpu
            binary: build/clap
            target: loongarch64
            preset: linux-loong64-cpu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross-compilation tools
        if: matrix.target != ''
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: gcc-14-${{ matrix.target }}-linux-gnu g++-14-${{ matrix.target }}-linux-gnu
          version: cross-${{ matrix.os }}-${{ matrix.target }}-gcc14-v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build build --config Release --target clap-cli --parallel
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mv "$BINARY" "$ASSET"
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber

  build-cuda:
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_KEY_PREFIX: clap.cpp/${{ matrix.preset }}/
      SCCACHE_GHA_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: clap-windows-amd64-cuda13.4.zip
            binary: build/clap-cuda.zip
            preset: windows-amd64-cuda13.4
            cuda_arch: x64
          - os: windows-11-arm
            asset: clap-windows-arm64-cuda13.4.zip
            binary: build/clap-cuda.zip
            preset: windows-arm64-cuda13.4
            cuda_arch: arm64
          - os: ubuntu-22.04
            asset: clap-linux-amd64-cuda12.9
            binary: build/clap
            preset: linux-amd64-cuda12.9
          - os: ubuntu-22.04-arm
            asset: clap-linux-arm64-cuda12.9
            binary: build/clap
            preset: linux-arm64-cuda12.9
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows-') && 'pwsh' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CUDA 12.9 build dependencies
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.2'
          method: network
          sub-packages: '["nvcc"]'
          non-cuda-sub-packages: '["libcublas-dev"]'
      - name: Install Windows CUDA toolkit
        if: runner.os == 'Windows'
        uses: MinoruSekine/setup-scoop@v5.0.1
        with:
          apps: cuda@13.4.3
      - name: Configure Windows CUDA environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cuda = (scoop prefix cuda).Replace('\', '/')
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cuda/bin/${{ matrix.cuda_arch }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set up Windows build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cuda_arch }}
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build build --config Release --target clap-cli --parallel 1

      # CUDA on Windows has no static cuBLAS library. Ship its runtime DLLs
      # beside clap.exe rather than publishing an unusable standalone binary.
      - name: Package Windows CUDA release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          $stage = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/clap-cuda"
          Copy-Item 'build/clap.exe' "$stage/clap.exe"
          foreach ($dll in @('cublas64_13.dll', 'cublasLt64_13.dll')) {
            Copy-Item "$env:CUDA_PATH/bin/${{ matrix.cuda_arch }}/$dll" $stage
          }
          Compress-Archive -Path "$stage/*" -DestinationPath $env:BINARY

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mv "$BINARY" "$ASSET"
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber

  build-vulkan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: clap-windows-amd64-vulkan.exe
            binary: build/Release/clap.exe
            preset: windows-amd64-vulkan
          - os: windows-11-arm
            asset: clap-windows-arm64-vulkan.exe
            binary: build/Release/clap.exe
            preset: windows-arm64-vulkan
          - os: ubuntu-24.04
            asset: clap-linux-amd64-vulkan
            binary: build/clap
            preset: linux-amd64-vulkan
          - os: ubuntu-24.04-arm
            asset: clap-linux-arm64-vulkan
            binary: build/clap
            preset: linux-arm64-vulkan
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux Vulkan build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libvulkan-dev glslc spirv-headers
          version: vulkan-${{ matrix.os }}-${{ runner.arch }}-v1
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows'
        uses: MinoruSekine/setup-scoop@v5.0.1
        with:
          apps: vulkan
      - name: Configure Windows Vulkan SDK environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = scoop prefix vulkan
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk/Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build build --config Release --target clap-cli --parallel
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mv "$BINARY" "$ASSET"
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber

  build-rocm:
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_KEY_PREFIX: clap.cpp/${{ matrix.preset }}/
      SCCACHE_GHA_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: clap-linux-amd64-rocm
            binary: build/clap
            preset: linux-amd64-rocm
          - os: windows-2022
            asset: clap-windows-amd64-rocm.exe
            binary: build/clap.exe
            preset: windows-amd64-rocm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows-') && 'pwsh' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Add ROCm 6.4.3 package repository
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/rocm.gpg > /dev/null
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4.3 jammy main' | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm
          sudo apt-get update
      - name: Install ROCm build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: hip-dev hipblas-dev rocblas-dev rocm-device-libs
          version: rocm-6.4.3-ubuntu-22.04-v2
      - name: Restore ROCm installation prefix
        if: runner.os == 'Linux'
        run: |
          # The APT cache restores package files, not rocm-core's postinst link.
          sudo ln -sfn /opt/rocm-6.4.3 /opt/rocm
          test -x /opt/rocm/llvm/bin/clang++
      - name: Set up Windows build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Install Windows HIP SDK 6.4.2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # AMD's 25.Q3 Server 2022 installer supplies HIP SDK 6.4.2.
          Invoke-WebRequest -Uri 'https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-25.Q3-WinSvr2022-For-HIP.exe' -OutFile "$env:RUNNER_TEMP/hip-sdk.exe"
          Start-Process "$env:RUNNER_TEMP/hip-sdk.exe" -ArgumentList '-install' -NoNewWindow -Wait
          'ROCM_PATH=C:/Program Files/AMD/ROCm/6.4' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_HIP_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build build --config Release --target clap-cli --parallel 1
      # Both assets require the matching system HIP/BLAS runtime; see README.
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mv "$BINARY" "$ASSET"
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber
