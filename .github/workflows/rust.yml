name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stable Rust and checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --manifest-path rust/Cargo.toml -- --check
      - name: Lint
        run: cargo +stable clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Real CPU inference and safety tests
        run: cargo +stable test --manifest-path rust/Cargo.toml --all-targets
      - name: Compile-fail thread-safety contract
        run: cargo +stable test --manifest-path rust/Cargo.toml --doc
      # This is intentionally a path-only crate; inventory is not a package build.
      - name: Inspect non-publishable package inventory
        run: cargo +stable package --manifest-path rust/Cargo.toml --list --allow-dirty
