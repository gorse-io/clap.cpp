[build-system]
requires = ["scikit-build-core>=1.1.2"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "clap-cpp"
version = "0.1.0"
description = "Python bindings for clap.cpp audio and text embeddings"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "mypy>=1.8", "typing_extensions>=4.2"]
cuda = ["clap-cpp-cuda==0.1.0"]
rocm = ["clap-cpp-rocm==0.1.0"]
vulkan = ["clap-cpp-vulkan==0.1.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["clap_cpp"]
# Wheel payload includes the staged runtime despite the wrapper-only sdist list.
wheel.force-include = { clap_cpp = "clap_cpp" }
# Package an externally built C ABI runtime, never configure or compile it here.
wheel.cmake = false
wheel.platlib = true
wheel.py-api = "py3"
sdist.cmake = false
# Explicit wrapper-only inventory also excludes staged binaries and their notices.
sdist.inclusion-mode = "explicit"
sdist.include = ["pyproject.toml", "README.md", "LICENSE", "_build_backend.py", "stage_runtime.py", "prepare_backend.py", "clap_cpp/*.py", "clap_cpp/*.pyi", "clap_cpp/py.typed", "tests/**"]
sdist.exclude = ["**/__pycache__/**", "**/.pytest_cache/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
