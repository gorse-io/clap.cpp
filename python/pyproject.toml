# Generated from pyproject.toml.j2; render for cpu, cuda, rocm or vulkan.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clap-cpp"
version = "0.1.0"
description = "Python bindings for clap.cpp audio and text embeddings"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "mypy>=1.8", "typing_extensions>=4.2"]
cuda = ["clap-cpp-cuda==0.1.0"]
rocm = ["clap-cpp-rocm==0.1.0"]
vulkan = ["clap-cpp-vulkan==0.1.0"]

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["clap_cpp"]
# The explicitly copied native payload is ignored by Git, not by the wheel.
ignore-vcs = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Never ship staged binaries, companion data or runtime notices in source archives.
include = ["/pyproject.toml", "/pyproject.toml.j2", "/README.md", "/LICENSE", "/hatch_build.py", "/clap_cpp/*.py", "/clap_cpp/*.pyi", "/clap_cpp/py.typed", "/tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
