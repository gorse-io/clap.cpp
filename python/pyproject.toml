[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "clap-cpp"
version = "0.1.0"
description = "Python bindings for clap.cpp audio and text embeddings"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "mypy>=1.8", "typing_extensions>=4.2"]
cuda = ["clap-cpp-cuda==0.1.0"]
rocm = ["clap-cpp-rocm==0.1.0"]
vulkan = ["clap-cpp-vulkan==0.1.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["clap_cpp"]
# ctypes uses the C ABI, not a CPython extension ABI; retain the native platform.
wheel.py-api = "py3"
install.components = ["runtime"]
cmake.source-dir = ".."
cmake.version = ">=3.20"
sdist.exclude = ["**/.git", "**/__pycache__/**", "dist/**", "build/**"]

# The sdist carries the pinned native sources, so it builds without a Git
# checkout, submodule initialization or network fetches during CMake configure.
[tool.scikit-build.sdist.force-include]
"../CMakeLists.txt" = "native/CMakeLists.txt"
"../LICENSE" = "LICENSE"
"../include" = "native/include"
"../src" = "native/src"
"../cmake" = "native/cmake"
"../ggml" = "native/ggml"
"../thirdparty/json" = "native/thirdparty/json"
"../thirdparty/miniaudio" = "native/thirdparty/miniaudio"
"../thirdparty/icu/LICENSE" = "native/thirdparty/icu/LICENSE"
"../thirdparty/icu/icu4c/source/common" = "native/thirdparty/icu/icu4c/source/common"
"../thirdparty/icu/icu4c/source/i18n" = "native/thirdparty/icu/icu4c/source/i18n"
"../thirdparty/icu/icu4c/source/stubdata" = "native/thirdparty/icu/icu4c/source/stubdata"

# Scikit-build-core's supported PKG-INFO predicate distinguishes extracted
# sdists from checkout builds; no generated checkout native/ tree or CMake shim.
[[tool.scikit-build.overrides]]
if.from-sdist = true
cmake.source-dir = "native"

# The base macOS runtime includes Metal; other platforms remain CPU-only.
[[tool.scikit-build.overrides]]
if.platform-system = "^darwin$"
inherit.cmake.define = "append"
cmake.define.GGML_METAL = "ON"
cmake.define.GGML_METAL_EMBED_LIBRARY = "ON"

[tool.scikit-build.cmake.define]
CLAP_BUILD_CLI = "OFF"
BUILD_TESTING = "OFF"
BUILD_SHARED_LIBS = "ON"
CLAP_STATIC_DEPENDENCIES = "ON"
CLAP_USE_SYSTEM_ICU = "OFF"
CMAKE_POSITION_INDEPENDENT_CODE = "ON"
CMAKE_INSTALL_LIBDIR = "clap_cpp"
CMAKE_INSTALL_BINDIR = "clap_cpp"
GGML_NATIVE = "OFF"
GGML_CPU = "ON"
GGML_METAL = "OFF"
GGML_METAL_EMBED_LIBRARY = "OFF"
GGML_CUDA = "OFF"
GGML_HIP = "OFF"
GGML_VULKAN = "OFF"
GGML_SYCL = "OFF"
GGML_OPENCL = "OFF"
GGML_OPENVINO = "OFF"
GGML_RPC = "OFF"
GGML_MUSA = "OFF"
GGML_WEBGPU = "OFF"
GGML_ZDNN = "OFF"
GGML_VIRTGPU = "OFF"
GGML_VIRTGPU_BACKEND = "OFF"
GGML_ET = "OFF"
GGML_HEXAGON = "OFF"
GGML_ZENDNN = "OFF"
GGML_BLAS = "OFF"
GGML_ACCELERATE = "OFF"
GGML_BACKEND_DL = "OFF"
GGML_OPENMP = "OFF"
GGML_BUILD_TESTS = "OFF"
GGML_BUILD_EXAMPLES = "OFF"
# Portable redistributable CPU code, rather than the build host ISA.
GGML_SSE42 = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_AVX_VNNI = "OFF"
GGML_BMI2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
GGML_AVX512 = "OFF"
GGML_AVX512_VBMI = "OFF"
GGML_AVX512_VNNI = "OFF"
GGML_AVX512_BF16 = "OFF"
GGML_AMX_TILE = "OFF"
GGML_AMX_INT8 = "OFF"
GGML_AMX_BF16 = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
