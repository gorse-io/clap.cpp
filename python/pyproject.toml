# Generated from pyproject.toml.j2; render for cpu, cuda, rocm or vulkan.
[build-system]
requires = ["scikit-build-core>=1.1.2"]
build-backend = "scikit_build_core.build"

[project]
name = "clap-cpp"
version = "0.1.0"
description = "Python bindings for clap.cpp audio and text embeddings"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "mypy>=1.8", "typing_extensions>=4.2"]
cuda = ["clap-cpp-cuda==0.1.0"]
rocm = ["clap-cpp-rocm==0.1.0"]
vulkan = ["clap-cpp-vulkan==0.1.0"]

[tool.scikit-build]
minimum-version = "1.1.2"
wheel.cmake = false
wheel.platlib = true
wheel.py-api = "py3"
wheel.packages = []
wheel.exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**", "**/tests/**", "**/*.j2"]
sdist.cmake = false
sdist.exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**", "**/tests/**", "**/*.j2"]
sdist.inclusion-mode = "explicit"
# Never ship staged binaries, companion data or runtime notices in source archives.
sdist.include = ["/pyproject.toml", "/README.md", "/LICENSE", "/clap_cpp/*.py", "/clap_cpp/*.pyi", "/clap_cpp/py.typed"]

[tool.scikit-build.wheel.force-include]
# Include Git-ignored external payloads without broadening the source archive.
"clap_cpp" = "clap_cpp"

[tool.pytest.ini_options]
testpaths = ["tests"]
